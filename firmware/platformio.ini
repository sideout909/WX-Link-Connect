[platformio]
default_envs = panellan_sc05_x
boards_dir = boards

[env:panellan_sc05_x]
platform = espressif32@6.12.0
board = panellan_sc05_x
framework = arduino
board_build.partitions = default_8MB.csv
board_build.embed_files = certs/x509_crt_bundle.bin
lib_deps =
    symlink://../vendor/LovyanGFX
    symlink://../vendor/ArduinoJson
    symlink://../vendor/PanelLan
    symlink://../vendor/RadioLib
    symlink://../vendor/rtl_433_ESP
build_unflags = -std=gnu++11
; Production observation exporters and the generic production updater are outside
; the Connect build. The only OTA path is connect_migration.cpp, a fixed, explicit
; one-way transition to the main WX-Link repository.
build_src_filter = +<*> -<network_jobs.cpp> -<firmware_updates.cpp>
build_flags =
    -std=gnu++17
    -fstack-usage
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -include connect_devices.h
    -DRF_CC1101="CC1101"
    -DRF_MODULE_SCK=10
    -DRF_MODULE_MISO=11
    -DRF_MODULE_MOSI=12
    -DRF_MODULE_CS=13
    -DRF_MODULE_GDO0=14
    -DRF_MODULE_GDO2=21
    -DLOG_LEVEL=0
monitor_speed = 115200
upload_speed = 460800
