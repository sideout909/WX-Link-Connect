<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Weather Link home screen concept</title>
<desc id="desc">Three fictional 320 by 240 touchscreen states: fresh readings, an active NWS warning, and unavailable NWS service while local reception continues. Temperature, inferred sky and lux, wind, humidity, rain and pressure remain prominent.</desc>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1200" height="620" rx="0" fill="#eef1f4" stroke="none"/>
<text x="32" y="36" font-size="11" fill="#4b6177" font-weight="700" letter-spacing="1.6">CYD WEATHER LINK  /  INTERFACE STUDY 01</text>
<text x="30" y="79" font-size="34" fill="#12283a" font-weight="600" letter-spacing="-1">Your weather, at a glance.</text>
<text x="32" y="106" font-size="15" fill="#536579" font-weight="400" >Local observations first. Clear connection health. Alerts that stay visible.</text>
