<text x="32" y="473" font-size="18" fill="#12283a" font-weight="600" >Everyday view</text>
<text x="32" y="500" font-size="12" fill="#536579" font-weight="400" >Temperature leads; lux informs a sky estimate.</text>
<text x="32" y="520" font-size="12" fill="#536579" font-weight="400" >Wind direction and units stay explicit.</text>
