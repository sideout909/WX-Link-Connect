<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Normal, watch, and warning home screen backgrounds</title><g font-family="DejaVu Sans,sans-serif"><rect x="0" y="0" width="1200" height="620" fill="#eef1f4" rx="0" /><text x="32" y="36" font-size="11" fill="#536579" font-weight="700">CYD WEATHER LINK / INTERFACE STUDY 02</text><text x="30" y="79" font-size="32" fill="#12283a" font-weight="600">A watch you can see. A warning you can hear.</text><text x="32" y="106" font-size="15" fill="#536579" font-weight="400">Full-screen alert colors · Optional sound · Your local readings stay in place.</text><text x="32" y="147" font-size="11" fill="#536579" font-weight="700">01 / NORMAL</text><rect x="27" y="164" width="358" height="271" fill="#1c2b3b" rx="9" /><g transform="translate(32 169) scale(1.0875)">
